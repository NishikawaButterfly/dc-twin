name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Quality, contracts, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Resolve reproducible environment
        run: |
          uv lock --check
          uv sync --locked --all-extras
      - name: Generate OpenAPI bootstrap artifact
        run: uv run python scripts/generate_openapi.py
      - name: Check formatting
        run: uv run ruff format --check --diff .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Validate contracts and reference calculations
        run: |
          uv run python scripts/check_contracts.py
          uv run python scripts/check_reference_results.py
          node --check web/app.js
      - name: Test kernel with branch coverage
        run: >-
          uv run pytest
          --cov=dc_twin
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*
          uv run --isolated --no-project --with dist/*.whl dc-twin --help
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Upload bootstrap and evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            uv.lock
            contracts/openapi/v1/openapi.json
            coverage.xml
            dist/*

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13", "3.14"]
        exclude:
          - os: windows-2025
            python: "3.12"
          - os: windows-2025
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Resolve and test
        run: |
          uv lock --check
          uv sync --locked --all-extras
          uv run pytest -q

  postgres:
    name: PostgreSQL 18 migrations and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: dc_twin_test
          POSTGRES_USER: dc_twin
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dc_twin -d dc_twin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DC_TWIN_DATABASE_URL: postgresql+psycopg://dc_twin:integration-only@127.0.0.1:5432/dc_twin_test
      DC_TWIN_TEST_DATABASE_URL: postgresql+psycopg://dc_twin:integration-only@127.0.0.1:5432/dc_twin_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Resolve environment
        run: |
          uv lock --check
          uv sync --locked --all-extras
      - name: Exercise migration lifecycle
        run: |
          uv run alembic upgrade head
          uv run pytest tests/test_postgres_integration.py -q
          uv run alembic downgrade base
          uv run alembic upgrade head

  container:
    name: Hardened Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and start full stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Exercise health, catalog, and reference simulation
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/reference-scenarios
          curl --fail --silent --show-error --request POST \
            http://127.0.0.1:8000/api/v1/reference-scenarios/REF-DC-2N-001/runs \
            --output /tmp/reference-result.json
          python -c "import json; value=json.load(open('/tmp/reference-result.json')); assert value['metrics']['unserved_energy_mj']==51200000000"
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

