version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      # Actions that ship as steps of one workflow (codeql-action init and
      # analyze) must move in lockstep; one grouped PR keeps them in sync.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, container]
    ignore:
      - dependency-name: python
        # Skip release-candidate image tags, both published forms:
        # glued (3.15.0rc1-slim-bookworm) and hyphenated (3.15-rc).
        versions: ["*.*rc*"]

