[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dc-twin"
version = "0.1.0"
description = "Deterministic, auditable capacity simulation for synthetic data-center electrical architectures."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "NishikawaButterfly" }]
keywords = ["data-center", "digital-twin", "electrical", "simulation", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]
release = [
  "build==1.4.0",
  "pip-audit==2.10.0",
  "twine==6.2.0",
]

[project.scripts]
dc-twin = "dc_twin.cli:main"

[project.urls]
Homepage = "https://github.com/NishikawaButterfly/dc-twin"
Issues = "https://github.com/NishikawaButterfly/dc-twin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_twin"]

[tool.hatch.build.targets.wheel.force-include]
"examples/synthetic" = "dc_twin/reference"
"web" = "dc_twin/static"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PTH", "RUF", "S", "SIM", "T20", "UP", "W"]
ignore = ["ANN401", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dc_twin"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["dc_twin"]
omit = [
  "src/dc_twin/api.py",
  "src/dc_twin/cli.py",
  "src/dc_twin/reference.py",
  "src/dc_twin/server.py",
  "src/dc_twin/storage.py",
  "src/dc_twin/tables.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
